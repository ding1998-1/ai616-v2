<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三重一大合规审核系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-area {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
            background: #f7f8fc;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            text-align: center;
            max-width: 100%;
            margin: 10px auto;
        }

        .message-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .input-area {
            padding: 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .welcome-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .welcome-message h3 {
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
                height: 100vh;
            }

            .header h1 {
                font-size: 24px;
            }

            .chat-area {
                max-height: calc(100vh - 380px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 三重一大合规审核系统</h1>
            <p>基于 LangChain Agent + Sentence Transformers 的智能审核助手</p>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome-message">
                <h3>👋 欢迎使用三重一大合规审核系统</h3>
                <p>本系统基于《中国核能电力股份有限公司 "三重一大"决策制度实施办法》进行智能合规审核。</p>
                <p style="margin-top: 10px; font-size: 13px;">
                    <strong>支持事项类型：</strong><br>
                    • 重大决策<br>
                    • 重大项目安排<br>
                    • 大额度资金运作<br>
                    • 重要人事任免
                </p>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI 正在审核中，请稍候...</p>
        </div>

        <div class="input-area">
            <form id="auditForm">
                <div class="form-group">
                    <label for="matterType">事项类型</label>
                    <select id="matterType" required>
                        <option value="">请选择事项类型</option>
                        <option value="重大决策">重大决策</option>
                        <option value="重大项目安排">重大项目安排</option>
                        <option value="大额度资金运作">大额度资金运作</option>
                        <option value="重要人事任免">重要人事任免</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="materialText">材料文本</label>
                    <textarea
                        id="materialText"
                        placeholder="请输入需要审核的材料文本..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">开始审核</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const chatArea = document.getElementById('chatArea');
        const auditForm = document.getElementById('auditForm');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (type === 'assistant') {
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMarkdown(text) {
            return text
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/- (.*$)/gm, '<li>$1</li>')
                .replace(/^(\d+)\. (.*$)/gm, '<li><strong>$1.</strong> $2</li>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        auditForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const matterType = document.getElementById('matterType').value;
            const materialText = document.getElementById('materialText').value;

            if (!matterType || !materialText) {
                alert('请填写所有字段');
                return;
            }

            submitBtn.disabled = true;
            loading.classList.add('active');

            addMessage(`事项类型：${matterType}`, 'user');
            addMessage(materialText, 'user');

            try {
                const response = await fetch(`${API_BASE_URL}/audit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        matter_type: matterType,
                        material_text: materialText
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    addMessage(formatMarkdown(data.report), 'assistant');
                } else {
                    addMessage(`审核失败：${data.message}`, 'system');
                }

            } catch (error) {
                console.error('Error:', error);
                addMessage(`错误：无法连接到服务器。请确保后端服务已启动。`, 'system');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        });

        window.addEventListener('load', () => {
            addMessage('系统已就绪，请选择事项类型并输入材料进行审核。', 'system');
        });
    </script>
</body>
</html>
