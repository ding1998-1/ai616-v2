server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;

    # ═══ rate limiting ═══
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=llm:10m rate=5r/m;

    # ═══ gzip compression ═══
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml
        application/wasm;

    # ═══ Static assets — long cache (Vite content-hash filenames) ═══
    location /assets/ {
        root /home/ai/文档/ai616/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ═══ Frontend SPA — lowest priority, only matches real static files ═══
    location / {
        root /home/ai/文档/ai616/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ═══ SSE — audit stream ═══
    location /audit_stream {
        proxy_pass http://127.0.0.1:8002/audit_stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location = /api/audit_stream {
        proxy_pass http://127.0.0.1:8002/audit_stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # ═══ SSE — knowledge base stream ═══
    location /kb_stream {
        proxy_pass http://127.0.0.1:8002/kb_stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /api/kb_stream {
        proxy_pass http://127.0.0.1:8002/kb_stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # ═══ WebSocket — AI meeting / Fun-ASR (仅 /api/meeting/ 前缀) ═══
    location /api/meeting/ {
        proxy_pass http://127.0.0.1:8002/api/meeting/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # ═══ SSE 实时推送 ═══
    location /api/meetings/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ═══ /api/ — all API calls (catch-all) ═══
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        # Return JSON for nginx errors instead of HTML
        error_page 502 503 504 = @api_error;
    }

    location @api_error {
        default_type application/json;
        return 503 '{"detail":"后端服务暂时不可用，请稍后重试"}';
    }

    # ═══ /doc/ — document endpoints ═══
    location /doc/ {
        proxy_pass http://127.0.0.1:8002/doc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # /api/doc/* → strip /api prefix
    location /api/doc/ {
        proxy_pass http://127.0.0.1:8002/doc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # ═══ 非 /api/ 前缀的后端接口 — 必须在 / (SPA) 之后注册以确保优先匹配 ═══
    location ~ ^/(health|matter-types|legal-case-types|legal-compare|ongoing-cases|upcoming-hearings|kb_stats|generate_template|ingest_file|parse_file|contract|ingest_knowledge) {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}

